<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#202124" />
    <title>Offline Page</title>
    <script>
      const siteRoot = new URL('./', window.location.href);

      async function openOfflinePage() {
        let siteIsReachable = navigator.onLine;

        if (siteIsReachable) {
          try {
            const response = await fetch(siteRoot.href, {
              method: 'HEAD',
              cache: 'no-store',
            });
            siteIsReachable = response.ok;
          } catch {
            siteIsReachable = false;
          }
        }

        const destination = siteIsReachable
          ? siteRoot.href
          : new URL('fallbackR-loader.html', siteRoot).href;
        window.location.replace(destination);
      }

      openOfflinePage();
    </script>
  </head>
  <body style="margin: 0; background: #202124; color: #bdc1c6; font: 16px Arial, sans-serif">
    <p style="margin: 24px">Opening the offline page...</p>
  </body>
</html>
